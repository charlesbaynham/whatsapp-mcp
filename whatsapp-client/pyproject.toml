[project]
name = "whatsapp-client"
version = "0.1.0"
description = "Python client for the whatsapp-bridge REST API (HTTP over a Unix socket or TCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_client"]
