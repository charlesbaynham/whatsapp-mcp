name: Build Proxmox LXC templates

# Every job builds from the exact same source; the templates differ only in
# NixOS options (media URL, forwarder). No path filtering: every push rebuilds all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  whatsapp:
    permissions:
      contents: write
    uses: charlesbaynham/nix-proxmox-cattle/.github/workflows/build-template.yml@v1
    with:
      # This repo's default branch is `main`, not the reusable workflow's
      # own default of `master`.
      release_branch: main
      attr: whatsapp

  charlesbot-whatsapp:
    permissions:
      contents: write
    uses: charlesbaynham/nix-proxmox-cattle/.github/workflows/build-template.yml@v1
    with:
      release_branch: main
      attr: charlesbot-whatsapp

  gaby-whatsapp:
    permissions:
      contents: write
    uses: charlesbaynham/nix-proxmox-cattle/.github/workflows/build-template.yml@v1
    with:
      release_branch: main
      attr: gaby-whatsapp
