name: Build Proxmox LXC templates

# Both jobs build from the exact same source - the app has no per-account
# config, so `whatsapp` and `charlesbot-whatsapp` are the identical image
# under two names. No path filtering: every push rebuilds both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  whatsapp:
    permissions:
      contents: write
    uses: charlesbaynham/nix-proxmox-cattle/.github/workflows/build-template.yml@v1
    with:
      # This repo's default branch is `main`, not the reusable workflow's
      # own default of `master`.
      release_branch: main
      attr: whatsapp

  charlesbot-whatsapp:
    permissions:
      contents: write
    uses: charlesbaynham/nix-proxmox-cattle/.github/workflows/build-template.yml@v1
    with:
      release_branch: main
      attr: charlesbot-whatsapp
