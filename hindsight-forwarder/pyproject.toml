[project]
name = "hindsight-forwarder"
version = "0.1.0"
description = "Forwards WhatsApp messages from whatsapp-bridge's event stream into Hindsight memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1", "whatsapp-client"]

[project.scripts]
hindsight-forwarder = "hindsight_forwarder.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight_forwarder"]

[tool.uv.sources]
whatsapp-client = { workspace = true }
